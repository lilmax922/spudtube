services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spudtube
      POSTGRES_PASSWORD: spudtube
      POSTGRES_DB: spudtube
    ports:
      - '5432:5432'
    volumes:
      - spudtube-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U spudtube -d spudtube]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spudtube-db:
