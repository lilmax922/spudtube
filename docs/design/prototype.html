<!DOCTYPE html>
<!-- TEMPORARY REFERENCE ONLY — docs/design/prototype.html 僅為可視化參考的暫定互動稿，不作為設計依據；最終產品實際樣式以 docs/agents/design-system.md 與各功能 spec 為準，並隨製作過程透過票證動態調整與收斂。 -->
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpudTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --background: oklch(0.105 0.012 275);
  --foreground: oklch(0.96 0.008 280);
  --card: oklch(0.155 0.018 278);
  --card-foreground: oklch(0.96 0.008 280);
  --popover: oklch(0.17 0.018 278);
  --popover-foreground: oklch(0.96 0.008 280);
  /* v2 primary: Neutral (owner choice) - other accents discarded */
  --primary: oklch(0.922 0 0);
  --primary-foreground: oklch(0.205 0 0);
  --secondary: oklch(0.24 0.02 282);
  --secondary-foreground: oklch(0.96 0.008 280);
  --muted: oklch(0.22 0.02 282);
  --muted-foreground: oklch(0.72 0.015 285);
  --accent: oklch(0.24 0.025 285);
  --accent-foreground: oklch(0.96 0.008 280);
  /* destructive separated from brand red */
  --destructive: oklch(0.52 0.18 26);
  --destructive-foreground: oklch(0.96 0 0);
  --border: oklch(1 0 0 / 9%);
  --input: oklch(1 0 0 / 13%);
  --ring: oklch(0.556 0 0);
  --radius: 0.625rem;
  --font-sans: 'Inter','Noto Sans TC',ui-sans-serif,system-ui,sans-serif;
  /* header height */
  --header-h: 64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);font-size:14px;line-height:1.7;color:var(--foreground);background:var(--background);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ---------- Header: Netflix 透明->不透明 ---------- */
#siteHeader{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--header-h);display:flex;align-items:center;gap:18px;padding:0 24px;background:linear-gradient(to bottom, rgba(0,0,0,.65) 0%, rgba(0,0,0,.35) 45%, transparent 100%);border-bottom:none;transition:background .28s ease, transform .28s ease, opacity .28s ease, backdrop-filter .28s ease}
#siteHeader.scrolled{background:rgba(15,15,15,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#siteHeader.detail-hidden{transform:translateY(-100%);opacity:0;pointer-events:none}
#siteHeader.detail-visible{transform:translateY(0);opacity:1;pointer-events:auto}
.header-inner{max-width:1280px;width:100%;margin:0 auto;display:flex;align-items:center;gap:18px}
.logo{display:inline-flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.02em;padding:6px 8px;border-radius:var(--radius);cursor:pointer}
.logo .pot{color:#FF0000; /* YouTube red only for logo */ display:inline-flex}
.logo:hover{background:rgba(255,255,255,.06)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--input);border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted-foreground)}
.search:focus-within{border-color:var(--ring);background:rgba(255,255,255,.12)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--foreground)}
.search input::placeholder{color:var(--muted-foreground)}
.search button{display:inline-flex;align-items:center;padding:4px;border-radius:6px;color:var(--muted-foreground)}
.search button:hover{color:var(--foreground);background:rgba(255,255,255,.12)}
#appnav{display:flex;gap:4px;align-items:center;margin-left:auto}
#appnav a{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;font-weight:600;transition:background .15s,color .15s,border-color .15s}
#appnav a.ghost{background:transparent;border:1px solid transparent;color:var(--muted-foreground)}
#appnav a.ghost:hover{background:var(--muted);color:var(--foreground)}
#appnav a.outline{background:transparent;border:1px solid var(--border);color:var(--foreground)}
#appnav a.outline:hover{background:var(--muted);border-color:var(--ring);color:var(--foreground)}
#appnav a.on{color:var(--foreground);background:var(--muted);border-color:var(--border)}
#searchOpenBtn.ghost{background:transparent;border:1px solid transparent;color:var(--muted-foreground)}
#searchOpenBtn.ghost:hover{background:var(--muted);color:var(--foreground)}
/* 語言切換器 — 右側導覽最左（Netflix/Prime 慣例：右上角、不搶主導覽） */
#langWrap{position:relative}
#langBtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted-foreground);background:transparent;border:1px solid transparent}
#langBtn:hover{background:var(--muted);color:var(--foreground)}
#langMenu{position:absolute;top:calc(100% + 8px);right:0;min-width:168px;background:var(--popover);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 16px 48px rgba(0,0,0,.55);z-index:80}
#langMenu[hidden]{display:none}
#langMenu button{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--foreground);background:none;border:none}
#langMenu button:hover{background:var(--muted)}
#langMenu .check{display:inline-flex;color:var(--foreground)}
/* Prime Video 式主導覽：Movies / TV shows 緊貼 brand */
#primeNav{display:flex;gap:2px;align-items:center;margin-left:4px}
.primeNavBtn{height:32px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:600;color:rgba(255,255,255,.72);transition:background .16s,color .16s}
.primeNavBtn:hover{color:#fff;background:rgba(255,255,255,.08)}
.primeNavBtn.on{background:rgba(255,255,255,.16);color:#fff}
#siteHeader.scrolled .primeNavBtn.on{background:rgba(255,255,255,.14)}
/* ---------- Search Overlay ---------- */
#searchOverlay{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;padding:72px 16px 24px;background:color-mix(in oklab, var(--background) 72%, transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);overflow:auto}
#searchOverlay[hidden]{display:none !important}
.searchSheet{width:min(720px,100%);background:var(--popover);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.searchBarRow{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin:12px}
.searchBarRow:focus-within{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklab, var(--ring) 20%, transparent)}
.searchBarRow input{flex:1;background:none;border:none;outline:none;color:var(--foreground);font-size:16px}
.searchBarRow input::placeholder{color:var(--muted-foreground)}
.searchBarRow button{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-foreground)}
.searchBarRow button:hover{color:var(--foreground);background:var(--muted)}
/* 移除原生 search cancel，避免雙 X */
input[type='search']::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
input[type='search']::-webkit-search-decoration{-webkit-appearance:none}
.searchPanel{max-height:62vh;overflow:auto}
.searchTabs{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.searchTabs button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);color:var(--muted-foreground);background:var(--muted)}
.searchTabs button.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.searchSection{padding:18px 16px}
.searchSection h4{font-size:13px;font-weight:700;color:var(--foreground);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.searchSection h4 .clearAll{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted-foreground);cursor:pointer}
.trendingChips{display:flex;flex-wrap:wrap;gap:8px}
.trendingChips button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--muted);color:var(--muted-foreground)}
.trendingChips button:hover{border-color:var(--ring);color:var(--foreground)}
.recentItem{display:flex;align-items:center;gap:10px;padding:10px 4px;border-radius:8px;cursor:pointer;color:var(--foreground)}
.recentItem:hover{background:var(--muted);color:var(--foreground)}
.searchResultList{display:flex;flex-direction:column}
.searchResultItem{display:flex;gap:16px;padding:16px;cursor:pointer;border-bottom:1px solid var(--border);align-items:center}
.searchResultItem:hover{background:var(--muted)}
.searchResultItem .thumb{width:96px;height:144px;border-radius:12px;flex-shrink:0;overflow:hidden;background:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:28px}
.searchResultItem .meta{display:flex;flex-direction:column;gap:6px;min-width:0;justify-content:center}
.searchResultItem .meta b{font-size:16px;font-weight:700;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:8px}
.searchResultItem .meta span{font-size:13px;color:var(--muted-foreground);display:inline-flex;align-items:center;gap:6px}
.searchResultItem .meta .star{color:#facc15}

/* ---------- Hero Full-bleed (Home) ---------- */
.heroFull{position:relative;min-height:520px;display:flex;align-items:center;padding:calc(var(--header-h) + 28px) 24px 48px;overflow:hidden;isolation:isolate}
.heroFull::before{content:"";position:absolute;inset:0;background:var(--hero-tone, #991b1b);z-index:-2}
.heroFull::after{content:"";position:absolute;inset:0;background:
  linear-gradient(to right, rgba(0,0,0,.78) 0%, rgba(0,0,0,.55) 42%, rgba(0,0,0,.18) 68%, transparent 88%),
  linear-gradient(to top, rgba(0,0,0,.55) 0%, transparent 38%);z-index:-1}
.heroInner{max-width:1280px;width:100%;margin:0 auto;display:flex;align-items:center}
.heroInfo{max-width:560px}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.72)}
.heroTitle{font-size:38px;line-height:1.15;font-weight:800;color:#fff;margin-top:6px;text-wrap:balance}
.heroMeta{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.84);margin-top:10px;flex-wrap:wrap}
.heroMeta .star{color:#fbbf24}
.heroOv{font-size:14px;line-height:1.7;color:rgba(255,255,255,.86);margin-top:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.heroActions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.btn{height:40px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:filter .15s, background .15s}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border:1px solid rgba(255,255,255,.38);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.muted{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.14)}
.btn.muted:hover{background:rgba(255,255,255,.18)}

/* ---------- Hero Carousel — Prime Video 輪播（Image1） ---------- */
.heroCarousel{position:relative;min-height:560px;overflow:hidden;isolation:isolate;width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);background:#0a0a0a}
.heroSlide{position:absolute;inset:0;display:flex;align-items:flex-end;padding:calc(var(--header-h) + 28px) 64px 64px;opacity:0;transition:opacity .55s ease;isolation:isolate}
.heroSlide.active{opacity:1;z-index:1}
.heroSlide::before{content:"";position:absolute;inset:0;background:var(--hero-tone,#1a1a2e);z-index:-2}
.heroSlide::after{content:"";position:absolute;inset:0;background:
  /* cinemap 式：左右兩側遮罩保留海報中心，底部加深（與 detailHeroFull 同款 mask） */
  linear-gradient(to right, rgba(0,0,0,.72) 0%, rgba(0,0,0,.45) 18%, transparent 32%, transparent 68%, rgba(0,0,0,.45) 82%, rgba(0,0,0,.72) 100%),
  linear-gradient(to top, rgba(0,0,0,.62) 0%, rgba(0,0,0,.22) 36%, transparent 58%);z-index:-1}
.heroCarousel .heroInner{max-width:1280px;width:100%;margin:0 auto;display:flex;align-items:flex-end}
.heroCarousel .heroInfo{max-width:560px;padding-bottom:8px}
.heroCarousel .kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:#0ea5e9;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.heroCarousel .kicker span{color:#fff;font-weight:700;letter-spacing:0;text-transform:none}
.heroArrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,.38);color:#fff;backdrop-filter:blur(6px);z-index:4;transition:background .15s}
.heroArrow:hover{background:rgba(0,0,0,.58)}
.heroArrow.prev{left:14px}
.heroArrow.next{right:14px}
.heroDots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:4}
.heroDot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.38);transition:all .22s;border:none;padding:0}
.heroDot.active{background:#fff;width:22px;border-radius:999px}
.heroAge{position:absolute;bottom:18px;right:24px;background:rgba(20,20,20,.72);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;padding:5px 9px;border-radius:4px;z-index:4}
/* Apple TV hero 5 列版型 */
.heroSub{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:600;color:rgba(255,255,255,.92);flex-wrap:wrap}
.heroSub .providerDot,.heroMetaLine .providerDot{width:26px;height:26px;border-radius:50%;background:#111;border:1px solid rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.heroSub .score{color:#fbbf24}
.heroOvWrap{position:relative;margin-top:12px;max-width:460px}
.heroOvApple{font-size:14.5px;line-height:1.65;color:rgba(255,255,255,.88);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:2px}
.heroOvApple.is-truncated{
  /* Apple TV truncate 淡出：第二行尾端由實色漸變到透明（參考 The Mist 頁 mask：right 44px transparent → 76px black） */
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 76px), transparent calc(100% - 16px));
  mask-image: linear-gradient(to right, #000 calc(100% - 76px), transparent calc(100% - 16px));
}
.morePill{position:absolute;right:2px;bottom:2px;background:rgba(255,255,255,.92);color:#0a0a0a;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.heroMetaLine{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:600;color:rgba(255,255,255,.88);flex-wrap:wrap}
.heroMetaLine .score{color:#fbbf24}
.heroMetaLine .adultBadge{font-size:11px;font-weight:600;color:rgba(255,255,255,.64);white-space:nowrap}
.heroActionsApple{display:flex;align-items:center;gap:12px;margin-top:18px}
.heroActionsApple .btnApplePrimary{height:44px;padding:0 28px;border-radius:999px;background:#fff;color:#111;font-weight:800;font-size:15px;letter-spacing:-.01em;border:none;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.heroActionsApple .btnApplePrimary:hover{filter:brightness(1.04)}
.heroActionsApple .btnAppleCircle{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;display:inline-flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.heroActionsApple .btnAppleCircle:hover{background:rgba(255,255,255,.18)}

/* ---------- Filter Bar (sticky, Cinemap) ---------- */
#filterBar{position:sticky;top:var(--header-h);z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 24px;background:rgba(20,20,22,.92);border-top:1px solid var(--border);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.filter-inner{max-width:1280px;width:100%;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--muted);border-radius:999px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted-foreground)}
.seg button.on{background:var(--primary);color:var(--primary-foreground)}
.divider{width:1px;height:24px;background:var(--border);margin:0 2px}
.chip{height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted-foreground);border:1px solid var(--input);background:transparent;transition:all .15s}
.chip:hover{color:var(--foreground);border-color:var(--ring)}
.chip.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.chip.ghost{color:var(--foreground);border-color:var(--border)}
.filterCount{margin-left:auto;font-size:12.5px;color:var(--muted-foreground);font-weight:500}

/* ---------- Main frame ---------- */
#mockframe{max-width:1280px;margin:0 auto;padding:0 24px 40px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:90;padding:10px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--popover);color:var(--popover-foreground);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Rows — Prime 5 欄橫滑，hover 外溢不被裁切 · See more 靠標題 + 右側半露 + hover 箭頭 ---------- */
.rows{display:flex;flex-direction:column;gap:40px;padding-top:24px}
.rowhead{display:flex;align-items:baseline;gap:14px;padding:0 2px 12px}
.rowhead h3{font-size:16.5px;font-weight:700;letter-spacing:.01em}
.rowhead .seeMore{font-size:13px;font-weight:700;color:rgba(255,255,255,.72);display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;transition:color .15s,background .15s}
.rowhead .seeMore:hover{color:#fff;background:rgba(255,255,255,.08)}
.rowhead .seeMore svg{opacity:.9}
.morecta{font-size:12.5px;font-weight:600;color:var(--muted-foreground);padding:4px 8px;border-radius:8px}
.morecta:hover{color:var(--foreground);background:var(--muted)}
.stripScroll{position:relative;overflow-x:auto;overflow-y:visible;padding-bottom:300px;margin-bottom:-280px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.stripScroll.breakout{width:calc(100% + (100vw - 100%)/2);margin-right:calc(-1 * (100vw - 100%)/2);padding-left:0;padding-right:60px;box-sizing:border-box}
.stripScroll::-webkit-scrollbar{display:none}
.strip{display:flex;gap:16px;overflow:visible;scroll-snap-type:x proximity;padding-bottom:0;margin-bottom:0;padding-right:12px}
.poster{width:240px;flex-shrink:0;cursor:pointer;outline:none;border-radius:12px;scroll-snap-align:start;overflow:visible;position:relative}
.poster:focus-visible{box-shadow:0 0 0 2px var(--ring)}
.art{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--muted);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.art .glyph{font-size:42px;font-weight:800;color:#fff;opacity:.88;transition:opacity .2s;letter-spacing:-.02em}
.poster:hover .glyph{opacity:.22}
.wlbtn{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px);opacity:0;transition:opacity .18s,background .15s;z-index:2}
.poster:hover .wlbtn,.wlbtn:focus-visible{opacity:1}
.wlbtn.on{background:var(--foreground);color:var(--background)}
/* 右上白 pill — TMDB 衍生發現標籤（見 getPrimeBadge 註解） */
.trendingBadge{position:absolute;top:0;right:0;background:#fff;color:#000;font-size:10px;font-weight:800;letter-spacing:.06em;padding:6px 11px;border-radius:0 12px 0 8px;z-index:2;line-height:1;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.primeBag{position:absolute;left:8px;bottom:8px;width:26px;height:26px;background:#facc15;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#000;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.posterHoverBar{position:absolute;left:0;right:0;bottom:0;padding:10px 10px 8px;background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.0) 100%);display:flex;align-items:center;justify-content:space-between;opacity:0;transition:opacity .2s;z-index:2}
.poster:hover .posterHoverBar{opacity:1}
.posterHoverBar .provMini{display:inline-flex;align-items:center}
.posterHoverBar .ratingMini{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;backdrop-filter:blur(4px)}
.posterHoverBar .ratingMini .star{color:#facc15}
/* hover 卡：比靜態卡更大（~320px）且圓角與靜態卡 12px 完全對齊 — 修復 z-index 被下一列 carousel 蓋住 */
.row{position:relative;z-index:1}
.row:hover{z-index:20}
.stripScroll{z-index:1}
.stripScroll:hover{z-index:5}
.poster{position:relative;z-index:1}
.poster:hover{z-index:40}
/* Prime 式 carousel 箭頭 — 僅在 hover 該列時顯現，左右各一，置於 stripScroll 內側貼邊（垂直置中於 16:9 卡片） */
.rowArrow{position:absolute;top:68px;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(12,12,12,.72);color:#fff;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:16;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s,background .15s,transform .18s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.row:hover .rowArrow{opacity:1;visibility:visible;pointer-events:auto}
.rowArrow:hover{background:rgba(20,20,20,.92);transform:translateY(-50%) scale(1.04)}
.rowArrow:active{transform:translateY(-50%) scale(.97)}
.rowArrow.prev{left:10px}
.rowArrow.next{right:10px}
.rowArrow[hidden]{display:none !important}
@media (max-width:560px){.rowArrow{display:none !important}}
.primeHover{position:absolute;top:-14px;left:-24px;right:-24px;bottom:auto;min-height:calc(100% + 28px);background:#0a0a0a;border:1px solid rgba(255,255,255,.14);border-radius:12px;overflow:hidden;opacity:0;visibility:hidden;transform:translateY(8px) scale(.96);transition:opacity .22s,visibility .22s,transform .22s;z-index:50;box-shadow:0 24px 48px rgba(0,0,0,.82), 0 8px 20px rgba(0,0,0,.5);display:flex;flex-direction:column;pointer-events:none}
.poster:hover .primeHover{opacity:1;visibility:visible;transform:translateY(0) scale(1);pointer-events:auto}
/* 首尾對齊：最左貼齊左側，最右貼齊右側，避免外溢視口 */
.strip .poster:first-child .primeHover{left:0;right:-48px}
.strip .poster:last-child .primeHover{left:-48px;right:0}
.pgrid .poster .primeHover{left:-14px;right:-14px;top:-10px}
.pgrid .poster:first-child .primeHover{left:0;right:-28px;top:-10px}
.pgrid .poster:last-child .primeHover{left:-28px;right:0;top:-10px}
.primeHover .primeArt{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--muted);border-radius:12px 12px 0 0;flex-shrink:0}
.primeHover .primeBody{padding:14px 16px 16px;background:#000;display:flex;flex-direction:column;gap:8px}
.primeHover .primeTitle{font-size:17px;font-weight:800;color:#fff;line-height:1.25;letter-spacing:-.01em}
.primeHover .primeWatch{font-size:12.5px;color:#facc15;display:flex;align-items:center;gap:6px;font-weight:600}
.primeHover .primeActions{display:flex;gap:8px;margin-top:2px}
.primeHover .primeActions button{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);color:#fff;transition:background .15s,transform .15s}
.primeHover .primeActions button:hover{background:rgba(255,255,255,.18);transform:scale(1.04)}
.primeHover .primeActions button.primaryPlay{background:#fff;color:#000;border-color:#fff}
.primeHover .primeActions button.primaryPlay:hover{background:#e8e8e8}
.primeHover .primeActions button.on{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.primeHover .primeRank{font-size:12px;font-weight:700;color:#22c55e;display:flex;align-items:center;gap:5px}
.primeHover .primeMeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:rgba(255,255,255,.66);font-weight:500}
.primeHover .primeMeta .pill{font-size:9px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:4px;background:#fff;color:#000}
.primeHover .primeMeta .ageBox{border:1px solid rgba(255,255,255,.28);padding:2px 6px;border-radius:4px;font-size:11px;color:rgba(255,255,255,.88);font-weight:600}
.primeHover .primeDesc{font-size:12.5px;line-height:1.55;color:rgba(255,255,255,.80);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ovl{position:absolute;inset:0;background:rgba(8,6,12,.0);opacity:0;transition:opacity .2s}
.cap{display:none}

/* ---------- Grid ---------- */
.resultbar{padding:20px 0 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.resultbar h3{font-size:16.5px;font-weight:700}
.xs{font-size:12px;font-weight:500}
.muted{color:var(--muted-foreground)}
.small{font-size:12.5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.pgrid .poster{width:100%}
.pgrid .art{aspect-ratio:16/9}
.sentinel{grid-column:1/-1;display:flex;justify-content:center;padding:16px 0}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--ring);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;color:var(--muted-foreground);text-align:center}
.empty b{font-size:15px;color:var(--foreground)}

/* ---------- Detail: Disney+ Full-bleed + cinemap 左右遮罩 ---------- */
.detailHeroFull{position:relative;min-height:72vh;display:flex;align-items:center;padding:calc(var(--header-h) + 40px) 24px 56px;overflow:hidden;isolation:isolate;
  /* breakout full viewport despite being inside #mockframe max-width */
  width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);
}
.detailHeroFull::before{content:"";position:absolute;inset:0;background:var(--detail-tone, #1a1a2e);z-index:-2}
.detailHeroFull::after{content:"";position:absolute;inset:0;background:
  /* cinemap 式：左右兩側遮罩保留海報中心，底部加深 */
  linear-gradient(to right, rgba(0,0,0,.72) 0%, rgba(0,0,0,.45) 18%, transparent 32%, transparent 68%, rgba(0,0,0,.45) 82%, rgba(0,0,0,.72) 100%),
  linear-gradient(to top, rgba(0,0,0,.62) 0%, rgba(0,0,0,.22) 36%, transparent 58%);
  z-index:-1}
.detailInner{max-width:1280px;width:100%;margin:0 auto;display:flex;gap:28px;align-items:flex-end}
.detailPoster{width:200px;flex-shrink:0;aspect-ratio:2/3;border-radius:var(--radius);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:#fff;overflow:hidden}
.detailInfo{flex:1;min-width:0;max-width:560px}
.dtitle{font-size:30px;line-height:1.15;font-weight:800;color:#fff;letter-spacing:-.01em}
.dyear{font-size:20px;font-weight:600;color:rgba(255,255,255,.62)}
.metarow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;font-weight:600;color:rgba(255,255,255,.88)}
.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.32);color:rgba(255,255,255,.92);background:rgba(255,255,255,.08)}
.drating{display:flex;align-items:center;gap:8px;margin-top:14px}
.avg{font-size:18px;font-weight:700;color:#fbbf24}
.avglab{font-size:12.5px;color:rgba(255,255,255,.7)}
.dact{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.tagline{margin-top:16px;font-style:italic;font-size:14px;color:rgba(255,255,255,.86)}
.overview{margin-top:10px;font-size:14px;line-height:1.7;color:rgba(255,255,255,.88)}
.crewline{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.66)}
.crewline b{color:rgba(255,255,255,.92);font-weight:600}
.backrow{max-width:1280px;margin:0 auto;padding:12px 24px 0}
.linkbtn{font-size:13px;font-weight:600;color:var(--muted-foreground);padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--border)}
.linkbtn:hover{color:var(--foreground);background:rgba(255,255,255,.1)}

/* ---------- Detail lower — TMDB 雙欄 + 分隔線（無卡片邊框），左右互換：主欄左、Facts 右 ---------- */
.dgrid{max-width:1280px;margin:0 auto;padding:32px 24px 40px;display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:start}
.dmain{order:1; display:flex;flex-direction:column;gap:0;min-width:0}
.dside{order:2; position:sticky;top:calc(var(--header-h) + 16px);display:flex;flex-direction:column;gap:0;min-width:0}
.detailSection{padding:24px 0;border-top:1px solid var(--border)}
.detailSection:first-child{border-top:none}
.detailSection h3{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--muted-foreground)}
.detailSection .sectionHint{font-size:11px;color:var(--muted-foreground);font-weight:500;margin-left:auto;text-transform:none;letter-spacing:0}
.detailFacts{background:transparent;border:none;padding:0}
.detailFacts dl{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;font-size:13px;margin-top:4px}
.detailFacts dt{color:var(--muted-foreground);font-weight:500}
.detailFacts dd{color:var(--foreground);font-weight:600}
/* legacy .panel kept for non-detail pages; detail uses detailSection */
.panel{background:color-mix(in oklab,var(--card) 78%,transparent);border:1px solid var(--border);border-radius:var(--radius);padding:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.panel h3{font-size:16.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.dfact dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.dfact dt{color:var(--muted-foreground)}
.dfact dd{color:var(--foreground);font-weight:500;text-align:right}
.kwrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.kwrow .tag{border-color:var(--input);color:var(--muted-foreground);background:var(--muted)}
.provgroup{margin-bottom:12px}
.glabel{font-size:12px;font-weight:600;color:var(--muted-foreground);display:block;margin-bottom:6px}
.provrow{display:flex;gap:8px;flex-wrap:wrap}
.prov{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--input);border-radius:999px;font-size:12.5px;font-weight:500;background:var(--muted)}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.castrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.castcard{width:96px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.castavatar{width:64px;height:64px;border-radius:50%;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--muted-foreground)}
.trailer{position:relative;aspect-ratio:16/9;border-radius:var(--radius);background:#0b0b0d;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.trailer .play{width:54px;height:54px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.trailer:hover .play{transform:scale(1.08)}
.recstrip{display:flex;gap:16px;overflow-x:auto;overflow-y:visible;padding-bottom:300px;margin-bottom:-280px;scrollbar-width:thin}
.recstrip::-webkit-scrollbar{height:6px}
.recstrip::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.ratepop{position:relative;display:inline-flex}
.rateicon{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.14)}
.rateicon.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.ratefly{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:var(--radius);background:var(--popover);border:1px solid var(--border);opacity:0;visibility:hidden;transition:opacity .16s,transform .16s;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ratepop:hover .ratefly{opacity:1;visibility:visible;transform:translateX(-50%)}
.rateopt{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--muted);color:var(--muted-foreground)}
.rateopt:hover{background:var(--secondary);color:var(--secondary-foreground)}
.rateopt.on{background:var(--primary);color:var(--primary-foreground)}
.statusrow{display:inline-flex;gap:6px}
.sbtn{width:38px;height:38px;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.72)}
.sbtn[data-active="1"]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}

/* ---------- My List ---------- */
.listtabs{display:flex;gap:8px;margin-bottom:20px;padding-top:24px}
.listitem{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:color-mix(in oklab,var(--card) 70%,transparent);cursor:pointer}
.listitem:hover{background:var(--card)}
.thumb{width:46px;height:66px;border-radius:8px;flex-shrink:0}

/* responsive — 保持 Prime 的 5→3→2 欄節奏，hover 在觸控設備改為點擊展開 */
@media (max-width: 880px){
  .heroTitle{font-size:28px}
  .detailInner{flex-direction:column;align-items:flex-start}
  .dgrid{grid-template-columns:1fr}
  .dmain{order:1}
  .dside{order:2;position:static}
  .detailHeroFull{min-height:56vh}
  #siteFooter > div:first-child{grid-template-columns:1fr 1fr}
  .poster{width:220px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}
@media (max-width: 560px){
  #siteFooter > div:first-child{grid-template-columns:1fr}
  .poster{width:168px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
  .art .glyph{font-size:32px}
  .primeHover{display:none} /* 手機不做 hover，避免誤觸 */
}
</style>
</head>
<body>
<header id="siteHeader">
  <div class="header-inner">
    <span class="logo" id="logoBtn" tabindex="0" role="button" aria-label="SpudTube 首頁">
      <span class="pot">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#FF0000"><path d="M12 3c-3.8 0-6.5 1.8-7.4 4.4C3.2 8.2 3 9 3 10c0 2 .8 3.4 2 4.8V19c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4.2c1.2-1.4 2-2.8 2-4.8 0-1-.2-1.8-.6-2.6C18.5 4.8 15.8 3 12 3zM8.5 8.5A1.5 1.5 0 1 1 8.5 11.5 1.5 1.5 0 0 1 8.5 8.5zm7 0a1.5 1.5 0 1 1-1.5 1.5 1.5 1.5 0 0 1 1.5-1.5zM12 13a1.5 1.5 0 1 1-1.5 1.5A1.5 1.5 0 0 1 12 13z"/></svg>
      </span>
      SpudTube
    </span>
    <nav id="primeNav" aria-label="影片類型">
      <button type="button" class="primeNavBtn" data-kind="movie">Movies</button>
      <button type="button" class="primeNavBtn" data-kind="tv">TV shows</button>
    </nav>
    <nav id="appnav" aria-label="主要導覽">
      <button id="searchOpenBtn" aria-label="搜尋" class="ghost" style="width:38px;height:38px;border-radius:999px;padding:0;justify-content:center;margin-right:2px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <a href="#" data-nav="list" class="ghost">我的清單</a>
      <div id="langWrap">
        <button type="button" id="langBtn" class="ghost" aria-label="選擇語言" aria-haspopup="menu" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="langLabel">繁中</span>
        </button>
        <div id="langMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-lang="zh-TW" aria-pressed="true"><span>繁體中文</span><span class="check"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
          <button type="button" role="menuitem" data-lang="en" aria-pressed="false"><span>English</span><span class="check" style="visibility:hidden"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        </div>
      </div>
      <a href="#" data-nav="login" class="outline">登入</a>
    </nav>
  </div>
</header>

<div id="searchOverlay" hidden aria-modal="true" role="dialog" aria-label="搜尋">
  <div class="searchSheet" role="search">
    <div class="searchBarRow">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.75"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="overlaySearch" type="search" placeholder="Search for any movie or TV show..." autocomplete="off" />
      <button id="overlayClose" aria-label="關閉搜尋"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div id="searchPanel" class="searchPanel"></div>
  </div>
</div>
<div id="heroSlot"></div>
<div id="filterBar">
  <div class="filter-inner" id="filterInner"></div>
</div>

<main id="mockframe">
  <div id="screenroot"></div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="trailerDialog" style="width:min(860px,92vw);padding:0;border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:#0a0a0c;color:var(--foreground);overflow:hidden">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)">
    <span style="font-size:14px;font-weight:700">預告片</span>
    <button type="button" data-trailer-close style="width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-foreground)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div style="padding:14px 16px 18px">
    <div style="position:relative;aspect-ratio:16/9;border-radius:var(--radius);background:#000;border:1px solid var(--border);display:flex;align-items:center;justify-content:center">
      <div style="width:60px;height:60px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#111"><path d="M8 5v14l11-7z"/></svg></div>
      <span style="position:absolute;bottom:14px;left:16px;font-size:12.5px;font-weight:600;color:#fff">▶ 正在播放：官方預告片</span>
    </div>
  </div>
</dialog>
<dialog id="overviewDialog" style="width:min(640px,92vw);padding:0;border:1px solid var(--border);border-radius:12px;background:#111;color:var(--foreground);overflow:hidden">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)">

// header scroll — home/topic/list: transparent→opaque at 80px, stays visible; detail-page only: hidden at top for immersion then appears at 80px
const header=$("#siteHeader");
function syncHeaderMode(){
 header.classList.remove("detail-hidden","detail-visible");
 onScroll();
}
function onScroll(){
 const y=window.scrollY||document.documentElement.scrollTop;
 const isDetailOnly = store.screen.name==="detail";
 if(y>80){
   header.classList.add("scrolled");
   if(isDetailOnly){ header.classList.remove("detail-hidden"); header.classList.add("detail-visible"); }
   else { header.classList.remove("detail-hidden","detail-visible"); }
 } else {
   header.classList.remove("scrolled");
   if(isDetailOnly){ header.classList.add("detail-hidden"); header.classList.remove("detail-visible"); }
   else { header.classList.remove("detail-hidden","detail-visible"); }
 }
}
window.addEventListener("scroll",onScroll,{passive:true});

// language switcher
const langWrap=$("#langWrap"), langBtn=$("#langBtn"), langMenu=$("#langMenu"), langLabel=$("#langLabel");
function setLang(code){
  store.lang=code;
  document.documentElement.lang=code;
  langLabel.textContent=code==="zh-TW"?"繁中":"EN";
  langMenu.querySelectorAll("[data-lang]").forEach(b=>{
    const on=b.dataset.lang===code;
    b.setAttribute("aria-pressed",String(on));
    b.querySelector(".check").style.visibility=on?"visible":"hidden";
  });
  toast(code==="zh-TW"?"語言已切換為繁體中文（示意）":"Language switched to English (demo)");
}
langBtn.addEventListener("click",(e)=>{
  e.stopPropagation();
  langMenu.hidden=!langMenu.hidden;
  langBtn.setAttribute("aria-expanded",String(!langMenu.hidden));
});
langMenu.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{
  langMenu.hidden=true;
  langBtn.setAttribute("aria-expanded","false");
  setLang(b.dataset.lang);
}));
document.addEventListener("click",(e)=>{
  if(!langMenu.hidden && !langWrap.contains(e.target)){
    langMenu.hidden=true;
    langBtn.setAttribute("aria-expanded","false");
  }
});

 if(!q){
   const recents=getRecent();
    searchPanel.innerHTML=`
      <div class="searchSection">
        <h4>Recent Searches ${recents.length?`<span class="clearAll" data-clear>Clear all</span>`:""}</h4>
        ${recents.length? recents.map(r=>`<div class="recentItem" data-q="${esc(r)}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ${esc(r)}</div>`).join("") : `<p class="small muted" style="color:var(--muted-foreground)">尚無搜尋紀錄</p>`}
      </div>
      <div class="searchSection" style="border-top:1px solid var(--border)">
        <h4><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M3 17L9 11L13 15L21 7"/><path d="M14 7h7v7"/></svg> Trending Searches</h4>
        <div class="trendingChips">${TRENDING.map(t=>`<button data-q="${esc(t)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> ${esc(t)}</button>`).join("")}</div>
      </div>
    `;
   searchPanel.querySelector("[data-clear]")?.addEventListener("click",e=>{e.stopPropagation();clearRecent();toast("已清除近期搜尋")});
   searchPanel.querySelectorAll("[data-q]").forEach(el=>el.addEventListener("click",()=>{
     overlaySearch.value=el.dataset.q; searchTab="all"; renderSearchPanel(); overlaySearch.focus();
   }));
   return;
 }
   // has query — show tabs + scrollable large-image results
 let list=TITLES.filter(x=>(x.t+x.en).toLowerCase().includes(q));
 if(searchTab==="movie") list=list.filter(x=>x.kind==="movie");
 if(searchTab==="tv") list=list.filter(x=>x.kind==="tv");
 list.sort((a,b)=>b.pop-a.pop);
 const tabs=[["all","All"],["movie","Movies"],["tv","TV Shows"]];
 searchPanel.innerHTML=`
   <div class="searchTabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${searchTab===k?"on":""}">${k==="movie"?"<svg width=12 height=12 viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><rect x=2 y=2 width=20 height=20 rx=2/><path d='M7 2v20'/></svg>":""}${k==="tv"?"<svg width=12 height=12 viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><rect x=2 y=7 width=20 height=15 rx=2/><path d='M17 2v5'/></svg>":""} ${l}</button>`).join("")}</div>
   <div class="searchResultList">
     ${list.length? list.map(x=>`
       <div class="searchResultItem" data-open="${x.id}">
         <div class="thumb" style="background:${x.tone}">${esc(x.glyph)}</div>
         <div class="meta"><b>${esc(x.t)} <span style="font-size:11px;border:1px solid var(--border);padding:1px 6px;border-radius:4px;color:var(--muted-foreground);font-weight:500">▭</span></b><span>${x.y} <span style="width:3px;height:3px;border-radius:50%;background:var(--border);display:inline-block"></span> <span class="star">★ ${x.r}</span> <span style="width:3px;height:3px;border-radius:50%;background:var(--border);display:inline-block"></span> ${KLABEL[x.kind]}</span></div>
        </div>`).join("") : `<div style="padding:32px 16px;text-align:center;color:var(--muted-foreground)"><b style="color:var(--foreground);display:block;margin-bottom:6px">No results</b><span class="small">Try different keywords</span></div>`}
   </div>
 `;
 searchPanel.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{searchTab=b.dataset.tab;renderSearchPanel();}));
 searchPanel.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",()=>{
   const id=el.dataset.open;
   const title=TITLES.find(t=>t.id===id);
   if(title) addRecent(title.t);
   closeSearch();
   store.screen={name:"detail",id};
   render();
   toast("已開啟："+(title?.t||id));
 }));
}
overlaySearch.addEventListener("input", renderSearchPanel);
overlaySearch.addEventListener("keydown", e=>{
 if(e.key==="Enter"){
   const v=overlaySearch.value.trim();
   if(!v) return;
   const hit=TITLES.find(x=>(x.t+x.en).toLowerCase().includes(v.toLowerCase()));
   if(hit){ addRecent(hit.t); closeSearch(); store.screen={name:"detail",id:hit.id}; render(); }
 }
});
$("#logoBtn").addEventListener("click",goHome);
$("#logoBtn").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")goHome();});
document.querySelectorAll("#appnav [data-nav]").forEach(a=>a.addEventListener("click",e=>{
 e.preventDefault();
 if(a.dataset.nav==="list"){store.screen={name:"list"};render();}
 else toast("登入為示意");
}));
// Prime 式 Header：Movies / TV shows（Image1），移除篩選列的電影/影集
document.querySelectorAll("#primeNav [data-kind]").forEach(b=>b.addEventListener("click",()=>{
 if(store.home.kind===b.dataset.kind) return;
 store.home.kind=b.dataset.kind;
 store.home.genres.clear();
 store.home.shown=PAGE;
 heroIdx=0;
 if(heroTimer){clearInterval(heroTimer);heroTimer=null;}
 // 若在 detail/list/topic，先回首頁再套用篩選
 if(store.screen.name!=="home") store.screen={name:"home"};
 syncFilterBar();
 syncPrimeNav();
 render();
 toast("已切換："+ (b.dataset.kind==="movie"?"電影":"影集"));
}));

// trailer dialog
(function(){
 const d=$("#trailerDialog");
 if(!d)return;
 const close=()=>{if(typeof d.close==="function")d.close();};
 d.querySelector("[data-trailer-close]").addEventListener("click",close);
 d.addEventListener("click",e=>{if(e.target===d)close();});
})();
// overview dialog — Apple TV MORE
(function(){
 const d=$("#overviewDialog");
 if(!d)return;
 const close=()=>{if(typeof d.close==="function")d.close();};
 d.querySelector("[data-overview-close]").addEventListener("click",close);
 d.addEventListener("click",e=>{if(e.target===d)close();});
})();

// init
render();
syncPrimeNav();
onScroll();
})();
</script>
</body>
</html>
