<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpudTube 設計系統基線 v8 — 可操作原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --background: oklch(0.105 0.012 275);
  --foreground: oklch(0.96 0.008 280);
  --card: oklch(0.17 0.018 278);
  --card-foreground: oklch(0.96 0.008 280);
  --popover: oklch(0.17 0.018 278);
  --popover-foreground: oklch(0.96 0.008 280);
  --primary: oklch(0.922 0 0);
  --primary-foreground: oklch(0.205 0 0);
  --secondary: oklch(0.24 0.02 282);
  --secondary-foreground: oklch(0.96 0.008 280);
  --muted: oklch(0.24 0.02 282);
  --muted-foreground: oklch(0.72 0.015 285);
  --accent: oklch(0.24 0.025 285);
  --accent-foreground: oklch(0.96 0.008 280);
  --destructive: oklch(0.72 0.2 25);
  --border: oklch(1 0 0 / 9%);
  --input: oklch(1 0 0 / 13%);
  --ring: oklch(0.556 0 0);
  --radius: 0.625rem;
  --font-sans: 'Inter','Noto Sans TC',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);font-size:14px;line-height:1.7;color:var(--foreground);background:var(--background);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ---------- 頂欄 = 漂浮 frosted 膠囊 ---------- */
#mockbar{position:sticky;top:16px;z-index:50;display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;padding:8px 16px;border:1px solid var(--border);border-radius:999px;background:color-mix(in oklab,var(--card) 72%,transparent);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .28s ease,opacity .28s ease}
#mockbar.hide{transform:translateY(-130%);opacity:0}
.logo{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:-.02em;padding:6px 8px;border-radius:var(--radius);cursor:pointer}
.logo:hover{background:var(--muted)}
.logo .pot{color:var(--primary)}
.search{flex:1;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--input);border-radius:var(--radius);background:color-mix(in oklab,var(--input) 30%,transparent);color:var(--muted-foreground)}
.search:focus-within{border-color:var(--ring)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--foreground)}
.search input::placeholder{color:var(--muted-foreground)}
.search button{display:inline-flex;align-items:center;padding:4px;border-radius:6px;color:var(--muted-foreground)}
.search button:hover{color:var(--foreground);background:var(--muted)}
#appnav{display:flex;gap:4px;align-items:center}
#appnav a{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--radius);font-weight:600;color:var(--muted-foreground);transition:background .15s,color .15s}
#appnav a:hover{color:var(--foreground);background:var(--muted)}
#appnav a.on{color:var(--primary);background:var(--primary-foreground)}

/* ---------- 主 frame ---------- */
#mockframe{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:90;padding:10px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--popover);color:var(--popover-foreground);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Hero ---------- */
.hero{margin-bottom:32px}
.screen{position:relative;display:flex;align-items:flex-end;gap:32px;min-height:340px;padding:40px 40px 32px;border-radius:calc(var(--radius) + 8px);overflow:hidden}
.screen-glyph{position:absolute;right:-20px;bottom:-60px;font-size:300px;font-weight:800;color:#fff;opacity:.06;pointer-events:none}
.screen-info{position:relative;z-index:1;max-width:640px}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:#fff;opacity:.75}
.screen-title{font-size:36px;line-height:1.2;font-weight:800;color:#fff;margin-top:6px}
.screen-meta{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#fff;opacity:.85;margin-top:8px}
.screen-meta .star{color:#fbbf24}
.screen-ov{font-size:14px;line-height:1.7;color:#fff;opacity:.85;max-width:560px;margin-top:12px}
.screen-actions{display:flex;gap:12px;margin-top:20px}
.screbtn{height:38px;padding:0 18px;border-radius:var(--radius);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.screbtn.primary{background:var(--primary);color:var(--primary-foreground)}
.screbtn.primary:hover{filter:brightness(1.08)}
.screbtn.ghost{border:1px solid rgba(255,255,255,.35);color:#fff}
.screbtn.ghost:hover{background:rgba(255,255,255,.12)}

/* ---------- Toolbar（單一控制工具列） ---------- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 4px;margin-bottom:24px}
.seg{display:inline-flex;background:var(--muted);border-radius:var(--radius);padding:3px;gap:2px}
.seg button{height:30px;padding:0 14px;border-radius:calc(var(--radius) - 2px);font-size:13px;font-weight:600;color:var(--muted-foreground)}
.seg button.on{background:var(--primary);color:var(--primary-foreground)}
.frdivider{width:1px;height:24px;background:var(--border);margin:0 4px}
.frgroup{display:inline-flex;gap:6px;align-items:center}
.chipbtn{height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted-foreground);border:1px solid var(--input);background:transparent;transition:background .15s,color .15s,border-color .15s}
.chipbtn:hover{color:var(--foreground);border-color:var(--ring)}
.chipbtn.on{background:var(--secondary);color:var(--secondary-foreground);border-color:var(--secondary)}
.chipbtn.ghost{color:var(--foreground);border-color:var(--border)}
.chipbtn.ghost:hover{border-color:var(--ring)}

/* ---------- 分類列 rows ---------- */
.rows{display:flex;flex-direction:column;gap:32px}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 12px}
.rowhead h3{font-size:16.5px;font-weight:700;letter-spacing:.01em}
.morecta{font-size:12.5px;font-weight:600;color:var(--muted-foreground);padding:4px 8px;border-radius:8px}
.morecta:hover{color:var(--foreground);background:var(--muted)}
.strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:22px;scrollbar-width:thin}
.strip::-webkit-scrollbar{height:6px}
.strip::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ---------- 海報卡片 ---------- */
.poster{width:168px;flex-shrink:0;cursor:pointer;outline:none;border-radius:var(--radius)}
.poster:focus-visible{box-shadow:0 0 0 2px var(--ring)}
.art{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center}
.art .glyph{font-size:56px;font-weight:800;color:#fff;opacity:.4;transition:opacity .2s}
.poster:hover .glyph{opacity:.18}
.wlbtn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px);opacity:0;transition:opacity .18s,background .15s}
.poster:hover .wlbtn,.wlbtn:focus-visible{opacity:1}
.wlbtn.on{background:var(--primary);color:var(--primary-foreground)}
.ovl{position:absolute;inset:0;background:rgba(8,6,12,.82);backdrop-filter:blur(3px);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;padding:14px}
.poster:hover .ovl{opacity:1}
.ovl p{font-size:12.5px;line-height:1.6;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cap{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.cap b{font-size:13px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap span{font-size:12px;color:var(--muted-foreground);display:inline-flex;align-items:center;gap:4px}
.cap .star{color:#fbbf24}

/* ---------- 篩選/搜尋結果 grid ---------- */
.resultbar{margin-bottom:16px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.resultbar h3{font-size:16.5px;font-weight:700}
.xs{font-size:12px;font-weight:500}
.muted{color:var(--muted-foreground)}
.small{font-size:12.5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
.pgrid .poster{width:100%}
.sentinel{grid-column:1/-1;display:flex;justify-content:center;padding:16px 0}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--ring);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;color:var(--muted-foreground);text-align:center}
.empty b{font-size:15px;color:var(--foreground)}

/* ---------- 返回列 / 主題頁 ---------- */
.backrow{padding:0 2px 10px}
.linkbtn{font-size:13px;font-weight:600;color:var(--muted-foreground);padding:4px 8px;border-radius:8px}
.linkbtn:hover{color:var(--foreground);background:var(--muted)}
.topichead{padding:4px 2px 20px;display:flex;flex-direction:column;gap:4px}
.topichead h1{font-size:24px;font-weight:700;letter-spacing:-.01em}/* ---------- 詳情頁 hero ---------- */
.dwrap{margin-bottom:32px}
.dhero{display:flex;gap:28px;padding:36px 36px 32px;border-radius:calc(var(--radius) + 8px)}
.bigposter{width:200px;flex-shrink:0}
.info{flex:1;min-width:0}
.dtitle{font-size:24px;font-weight:700;letter-spacing:-.01em;color:#fff}
.dyear{font-size:20px;font-weight:600;color:rgba(255,255,255,.6)}
.metarow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.9)}
.drating{display:flex;align-items:center;gap:8px;margin-top:14px}
.avg{font-size:18px;font-weight:700;color:#fbbf24}
.avglab{font-size:12.5px;color:rgba(255,255,255,.7)}
.dact{display:flex;align-items:center;gap:12px;margin-top:16px}
.tagline{margin-top:16px;font-style:italic;font-size:14px;color:rgba(255,255,255,.85)}
.overview{margin-top:10px;font-size:14px;line-height:1.7;color:rgba(255,255,255,.88);max-width:640px}
.crewline{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.65)}
.crewline b{color:rgba(255,255,255,.9);font-weight:600}

/* ---------- 詳情兩欄 ---------- */
.dgrid{display:grid;grid-template-columns:280px 1fr;gap:32px;margin-bottom:32px}
.dside{display:flex;flex-direction:column;gap:16px}
.dmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:color-mix(in oklab,var(--card) 78%,transparent);border:1px solid var(--border);border-radius:var(--radius);padding:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.panel h3{font-size:16.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.dfact h3{margin-bottom:8px}
.dfact dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.dfact dt{color:var(--muted-foreground)}
.dfact dd{color:var(--foreground);font-weight:500;text-align:right}
.dfact hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.kwrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.kwrow .tag{border-color:var(--input);color:var(--muted-foreground)}

/* ---------- 提供平台 ---------- */
.provgroup{margin-bottom:12px}
.glabel{font-size:12px;font-weight:600;color:var(--muted-foreground);display:block;margin-bottom:6px}
.provrow{display:flex;gap:8px;flex-wrap:wrap}
.prov{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--input);border-radius:999px;font-size:12.5px;font-weight:500;background:var(--muted)}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.attrline{margin-top:8px;font-size:11.5px;color:var(--muted-foreground)}
.input{height:30px;padding:0 10px;border:1px solid var(--input);border-radius:var(--radius);background:var(--muted);color:var(--foreground)}

/* ---------- 演員 ---------- */
.castrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.castcard{width:96px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.castavatar{width:64px;height:64px;border-radius:50%;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--muted-foreground)}
.castcard b{font-size:12.5px;font-weight:600}
.castcard span{font-size:11.5px;color:var(--muted-foreground)}

/* ---------- 預告片 ---------- */
.trailer{position:relative;aspect-ratio:16/9;border-radius:var(--radius);background:#0b0b0d;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.trailer .play{width:54px;height:54px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.trailer:hover .play{transform:scale(1.08)}
.playinglabel{position:absolute;bottom:12px;left:14px;font-size:12px;font-weight:600;color:#fff;opacity:0;transition:opacity .2s}
.trailer.playing .playinglabel{opacity:1}

/* ---------- 預告 dialog ---------- */
.trailer-dialog{width:min(860px,92vw);padding:0;border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:#0a0a0c;color:var(--foreground);overflow:hidden}
.trailer-dialog::backdrop{background:rgba(6,6,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.td-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.td-title{font-size:14px;font-weight:700}
.td-close{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-foreground)}
.td-close:hover{color:var(--foreground);background:var(--muted)}
.td-body{padding:14px 16px 18px}
.td-trailer{position:relative;aspect-ratio:16/9;border-radius:var(--radius);background:#000;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden}
.td-trailer .play{width:60px;height:60px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.td-trailer .playinglabel{position:absolute;bottom:14px;left:16px;font-size:12.5px;font-weight:600;color:#fff;opacity:1}
.td-caption{margin-top:10px;font-size:12.5px;color:var(--muted-foreground)}

/* ---------- 相關推薦 ---------- */
.recstrip{display:flex;gap:16px;overflow-x:auto;padding-bottom:22px;margin-bottom:24px}
.recstrip .poster{width:168px}

/* ---------- 我的清單 ---------- */
.listtabs{display:flex;gap:8px;margin-bottom:20px}
.listitem{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:color-mix(in oklab,var(--card) 70%,transparent);cursor:pointer;transition:background .15s}
.listitem:hover{background:var(--card)}
.listitem + .listitem{margin-top:8px}
.thumb{width:46px;height:66px;border-radius:8px;flex-shrink:0}
.li-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-main b{font-size:14px;font-weight:600}
.li-main span{font-size:12.5px;color:var(--muted-foreground);display:inline-flex;align-items:center;gap:4px}
.li-main .star{color:#fbbf24}

/* ---------- 評價（Netflix 式） ---------- */
.ratepop{position:relative;display:inline-flex}
.rateicon{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--muted);color:var(--muted-foreground);border:1px solid var(--input)}
.rateicon.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.ratefly{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:var(--radius);background:var(--popover);border:1px solid var(--border);opacity:0;visibility:hidden;transition:opacity .16s,transform .16s;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ratepop:hover .ratefly{opacity:1;visibility:visible;transform:translateX(-50%)}
.rateopt{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--muted);color:var(--muted-foreground)}
.rateopt:hover{background:var(--secondary);color:var(--secondary-foreground)}
.rateopt.on{background:var(--primary);color:var(--primary-foreground)}

/* ---------- 狀態 ---------- */
.statusrow{display:inline-flex;gap:6px}
.sbtn{width:38px;height:38px;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--input);color:var(--muted-foreground)}
.sbtn[data-active="1"]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}

/* ---------- 試色 dock / 色票 ---------- */
.themedock{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:color-mix(in oklab,var(--popover) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.themedock .dlab{font-size:12px;font-weight:600;color:var(--muted-foreground);margin-right:2px}
.tswatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.tswatch.on{border-color:var(--foreground);box-shadow:0 0 0 2px var(--background)}

/* ---------- 設計系統參照區（下方 section） ---------- */
.refs{max-width:1180px;margin:40px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:32px}
.refcard{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:24px}
.refcard h2{font-size:16.5px;font-weight:700;margin-bottom:4px}
.refcard .hint{font-size:12.5px;color:var(--muted-foreground);margin-bottom:16px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.swatch{display:flex;align-items:center;gap:12px}
.swatch .chip{width:44px;height:44px;border-radius:10px;flex-shrink:0}
.swatch .meta{display:flex;flex-direction:column;min-width:0}
.swatch .meta b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatch .meta span{font-size:11.5px;color:var(--muted-foreground);font-family:ui-monospace,monospace}
.iconrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.iconcell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--muted)}
.iconcell span{font-size:11.5px;color:var(--muted-foreground)}

/* ---------- 提示 chips ---------- */
.trychips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.try{font-size:12px;font-weight:500;color:var(--muted-foreground);padding:6px 12px;border:1px solid var(--input);border-radius:999px;background:var(--muted)}

/* ---------- 決策表單 ---------- */
.decision{border:1px dashed var(--ring);border-radius:var(--radius);padding:20px}
.decision h2{font-size:16.5px;font-weight:700;margin-bottom:4px}
.decision .hint{font-size:12.5px;color:var(--muted-foreground);margin-bottom:12px}
.decision .opts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.decision label{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--input);border-radius:999px;font-size:13px;font-weight:500;cursor:pointer}
.decision label:has(input:checked){background:var(--secondary);color:var(--secondary-foreground);border-color:var(--secondary)}
.decision .queuednote{display:none;font-size:12px;color:var(--muted-foreground);align-items:center;gap:6px}
.queuednote svg{color:#22c55e}
.decision button[type="submit"]{height:38px;padding:0 18px;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font-weight:600;margin-right:10px}
.decision button[type="submit"]:hover{filter:brightness(1.08)}</style>
</head>
<body>
<div id="mockframe">
  <header id="mockbar">
    <span class="logo" tabindex="0" role="button" aria-label="SpudTube 首頁">
      <span class="pot">

function bindOpen(scope){(scope||root).querySelectorAll("[data-open]").forEach(el=>{
 el.addEventListener("click",()=>{store.screen={name:"detail",id:el.dataset.open};render();});
 el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();store.screen={name:"detail",id:el.dataset.open};render();}});
});(scope||root).querySelectorAll("[data-wl]").forEach(el=>el.addEventListener("click",e=>{
 e.stopPropagation();e.preventDefault();
 const id=el.dataset.wl,cur=store.status[id];
 if(cur==="watchlisted"){delete store.status[id];toast("已從待看清單移除");}
 else{store.status[id]="watchlisted";toast("已加入待看清單");}
 render();
}));}

function syncRail(){

}

function renderRows(area){
 const k=store.home.kind,kl=KLABEL[k];
 const pool=TITLES.filter(x=>x.kind===k);
 const byPop=(a,b)=>b.pop-a.pop;
 const byRate=(a,b)=>b.r-a.r;
 const byNew=(a,b)=>b.y-a.y||b.pop-a.pop;
 const rows=[
  {key:"trending",label:`本週熱門${kl}`,items:pool.slice().sort(byPop)},
  {key:"top",label:`高評價${kl}`,items:pool.slice().sort(byRate)},
  k==="movie"?{key:"now",label:"現正熱映",items:pool.slice().sort(byNew)}
             :{key:"airing",label:"本季播映中",items:pool.slice().sort(byNew)},
  ...BEST.map(([name,gs],i)=>({key:"g"+i,label:`${name}${kl}`,items:pool.filter(x=>x.g.some(g=>gs.includes(g)))}))
 ].filter(r=>r.items.length);
 area.innerHTML=`<div class="rows">${rows.map(r=>`
   <section class="row"><div class="rowhead"><h3>${r.label}</h3><button type="button" class="morecta" data-cat="${r.key}">查看全部 →</button></div>
   <div class="strip">${r.items.map(posterCard).join("")}</div></section>`).join("")}</div>`;
 bindOpen(area);
 area.querySelectorAll("[data-cat]").forEach(el=>el.addEventListener("click",()=>{
   const r=rows.find(x=>x.key===el.dataset.cat);

function renderGrid(area,mode){
 const h=store.home;
 let list;
 if(mode==="search"){
   const q=h.query.toLowerCase();
   list=TITLES.filter(x=>(x.t+x.en).toLowerCase().includes(q));
 }else{
   list=TITLES.filter(x=>x.kind===h.kind);
   if(h.genres.size)list=list.filter(x=>x.g.some(g=>h.genres.has(g)));
   if(h.rating)list=list.filter(x=>x.r>=Number(h.rating));
 }
 list.sort((a,b)=>b.pop-a.pop);
 const shown=list.slice(0,h.shown);
 const more=list.length>h.shown;
 const bits=[];
 if(mode==="search")bits.push(`「${esc(h.query)}」`,"跨電影與影集");
 else{
   bits.push(KLABEL[h.kind]);
   if(h.genres.size)bits.push(`類型：${[...h.genres].map(g=>GLABEL[g]).join("、")}（OR）`);
   if(h.rating)bits.push(`★ ${h.rating}+ 以上`);
 }
 area.innerHTML=`
 <div class="resultbar">
   <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
     <h3>${mode==="search"?"搜尋結果":"篩選結果"}</h3>
     ${bits.map(b=>`<span class="xs muted">${b}</span>`).join("")}
     <span class="xs muted">共 ${list.length} 部 · 依熱門度排序 · 捲動自動載入更多</span>
   </div>
 </div>
 <div class="pgrid">
   ${shown.map(posterCard).join("")||`<div class="empty" style="grid-column:1/-1"><span style="opacity:.5">${iconSat()}</span><b>查無結果</b><span class="small">${mode==="search"?"換個關鍵字試試":"清掉幾個條件再試試"}</span></div>`}
   ${more?`<div class="sentinel" id="sentinel"><div class="spinner" aria-label="載入中"></div></div>`:""}
 </div>`;
 bindOpen(area);
 const sent=$("#sentinel");
 if(sent){const ob=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){ob.disconnect();setTimeout(()=>{store.home.shown+=PAGE;renderContent();toast("已載入更多結果");},550);}},{rootMargin:"160px"});ob.observe(sent);}
}

function renderContent(){
 const area=$("#contentarea");
 if(!area)return;
 const h=store.home;
 if(h.query)renderGrid(area,"search");
 else if(h.genres.size||h.rating)renderGrid(area,"filter");
 else renderRows(area);
}

(function stickyBar(){
 const bar=$("#mockbar"),frameEl=$("#mockframe");
 let lastY=window.scrollY;
 window.addEventListener("scroll",()=>{
   const y=window.scrollY,delta=y-lastY;lastY=y;
   const rect=frameEl.getBoundingClientRect();
   const stuck=rect.top<=0&&rect.bottom>90;
   if(!stuck){bar.classList.remove("hide");return;}
   if(delta>2&&y>60)bar.classList.add("hide");
   else if(delta<-2)bar.classList.remove("hide");
 },{passive:true});
})();

const swatches=[["background","背景"],["foreground","前景文字"],["card","卡片"],["primary","主要（按鈕）"],["secondary","次要"],["muted","靜音底"],["accent","強調底"],["destructive","破壞性"],["border","邊框"],["ring","焦點環"]];
function renderSwatches(){
 $("#swatches").innerHTML=swatches.map(([n,l])=>{
  const cs=getComputedStyle(document.documentElement);
  const v=cs.getPropertyValue("--"+n).trim();
  return `<div class="swatch"><div class="chip" style="background:var(--${n});${n==="border"||n==="ring"?'box-shadow:inset 0 0 0 1px rgba(128,128,128,.3);':""}"></div><div class="meta"><b>--${n} · ${l}</b><span>${esc(v)||"—"}</span></div></div>`;
 }).join("");
}
renderSwatches();

function applyAccent(pid){
 const pal=PALETTES.find(x=>x.id===pid);
 if(!pal)return;
 const rs=document.documentElement.style;
 rs.setProperty("--primary",pal.p);
 rs.setProperty("--primary-foreground",pal.pf);
 rs.setProperty("--ring",pal.ring);
 try{localStorage.setItem("spudtube.accent",pid);}catch(e){}
 document.querySelectorAll(".tswatch").forEach(b=>b.classList.toggle("on",b.dataset.pal===pid));
 const r=document.querySelector(`input[name="q2"][data-pal="${pid}"]`);
 if(r)r.checked=true;
 renderSwatches();
}
(function themeDock(){
 let saved=null;try{saved=localStorage.getItem("spudtube.accent");}catch(e){}
 if(!PALETTES.some(p=>p.id===saved))saved="mono";
 const dock=document.createElement("div");
 dock.className="themedock";dock.id="themedock";
 dock.setAttribute("role","radiogroup");dock.setAttribute("aria-label","品牌強調色即時試色");
 dock.innerHTML=`<span class="dlab">試色</span>`+PALETTES.map(p=>`<button type="button" class="tswatch${p.id===saved?" on":""}" data-pal="${p.id}" style="background:${p.p};${p.id==="mono"?"box-shadow:inset 0 0 0 1px rgba(128,128,128,.45)":""}" title="${p.label}" aria-label="${p.label}"></button>`).join("");
 dock.addEventListener("click",e=>{const b=e.target.closest("[data-pal]");if(b)applyAccent(b.dataset.pal);});
 document.body.appendChild(dock);
 applyAccent(saved);
})();
