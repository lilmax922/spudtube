# :schema node_modules/wrangler/config-schema.json
# Cloudflare Pages project for SpudTube (Nuxt SSR). Pushing to `main` triggers an
# automatic Pages build (`nuxt build` → `cloudflare_pages` Nitro preset). Secrets are
# never committed — they live only in the dashboard (Settings → Variables and Secrets).
name = "spudtube"
compatibility_date = "2026-08-01"
compatibility_flags = [ "nodejs_compat" ]

# Presence of this block documents the production DB wiring. The actual binding is
# created once via `wrangler hyperdrive create` (or the dashboard) against the Supabase
# transaction pooler URL, then attached to the Pages project as `HYPERDRIVE`.
# See scripts/production-wizard.mjs and docs/agents/production-deploy.md.
# `localConnectionString` lets `wrangler pages dev` run against the local Docker DB.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"
localConnectionString = "postgresql://spudtube:spudtube@localhost:5432/spudtube"
